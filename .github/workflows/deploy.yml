name: deploy

# Manual only. The first job plans with the read-only role and writes the resource changes to
# the run summary. The second job waits for an approval on the `production` environment, then
# applies (or destroys) with the deploy role, whose writes are scoped to this project.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the dev stack
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

concurrency:
  group: deploy-dev # never two applies at once; the S3 lock would refuse anyway
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_VERSION: "1.17.0"
  AWS_REGION: eu-west-1
  HF_HUB_DISABLE_TELEMETRY: "1"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform -chdir=infra/envs/dev init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: terraform plan
        run: |
          set -o pipefail
          flag=""; [ "${{ inputs.action }}" = "destroy" ] && flag="-destroy"
          terraform -chdir=infra/envs/dev plan $flag -input=false -no-color -lock-timeout=120s | tee plan.txt
          {
            echo "### Plan to ${{ inputs.action }} the dev stack"
            echo '```'
            grep -E '^\s+# \S+ (will be|must be)|^(Plan:|No changes\.)' plan.txt | sed 's/^ *//'
            echo '```'
            echo "Approve the **production** environment to run it."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production # a required reviewer approves before this job starts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform -chdir=infra/envs/dev init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: terraform ${{ inputs.action }}
        run: |
          set -o pipefail
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform -chdir=infra/envs/dev destroy -input=false -no-color -auto-approve -lock-timeout=120s
          else
            terraform -chdir=infra/envs/dev apply -input=false -no-color -auto-approve -lock-timeout=120s
          fi
      - name: Smoke test GET /health
        if: inputs.action == 'apply'
        run: |
          url="$(terraform -chdir=infra/envs/dev output -raw api_url)"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$url/health"; then echo; exit 0; fi
            sleep 10
          done
          exit 1
