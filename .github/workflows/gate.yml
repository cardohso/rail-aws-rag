name: gate

# Manual quality gate: goldpass asks the deployed API the 20 golden questions and fails below
# the thresholds in eval/live/thresholds.yaml. Deterministic metrics only, so a run costs about
# 20 model answers (a few cents) and uses 20 of the day's 50 requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_VERSION: "1.17.0"
  AWS_REGION: eu-west-1

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role, to read the API URL from state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Read the API URL from the dev stack
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform -chdir=infra/envs/dev init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          url="$(terraform -chdir=infra/envs/dev output -raw api_url)"
          echo "::add-mask::$url"
          echo "API_URL=$url" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check the API is up
        run: curl -fsS --max-time 30 "$API_URL/health" > /dev/null
      - name: Run goldpass
        run: uv run --frozen --group gate goldpass run --config eval/live/goldpass.yaml
      - name: Show the report
        if: always()
        run: |
          report=eval/live/results/latest.md
          [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY" || echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-gate-results
          path: eval/live/results/
          if-no-files-found: ignore
