# Live gate: ask the deployed API the 20 golden questions and score what comes back.
# Deterministic metrics only (no LLM judge, no extra model cost).
#
#   API_URL=https://<id>.execute-api.eu-west-1.amazonaws.com \
#     uv run --group gate goldpass run --config eval/live/goldpass.yaml
#
# Run by .github/workflows/gate.yml, which reads API_URL from the dev stack's Terraform output.
golden: golden.jsonl
thresholds: thresholds.yaml
baseline: baseline.json # compared once a baseline is committed (skipped if the file is missing)
out: results/latest.json # a Markdown report is written next to it

system:
  type: http
  url: ${API_URL}/ask
  method: POST
  body: {question: "{question}"}
  timeout_s: 45
  # The API throttles to 1 request per second and caps the day at 50. One question every 3 s
  # stays well under the first and a full run (20) leaves room for a second run on the same day.
  min_interval_s: 3
  concurrency: 1
  retry: {attempts: 3, backoff_s: 5, max_wait_s: 60}
  fields:
    answer: answer
    refused: refused
    # The API returns the passages the answer cites, not every passage the generator saw, so
    # retrieval metrics here measure what reaches the user: gold passages that are cited.
    contexts: citations
    citations: citations
    passage: {id: passage_id, doc_id: doc_id, text: passage, score: score}
    citation: {passage_id: passage_id, doc_id: doc_id}

generator: {model: amazon.nova-lite-v1, family: amazon}
