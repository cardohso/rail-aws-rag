[project]
name = "rail-aws-rag"
version = "0.1.0"
description = "RAG assistant over EU railway law on AWS: offline index build, in-memory retrieval, Bedrock generation."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.0",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
# The quality gate. goldpass is not on PyPI yet, so it comes from a tagged release of its repo.
gate = [
    "goldpass @ git+https://github.com/cardohso/goldpass@v0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail_aws_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rail_aws_rag"]
known-local-folder = ["fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
